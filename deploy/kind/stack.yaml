apiVersion: v1
kind: Service
metadata: {name: control-plane}
spec:
  selector: {app: control-plane}
  ports: [{port: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: control-plane}
spec:
  replicas: 1
  selector: {matchLabels: {app: control-plane}}
  template:
    metadata:
      labels: {app: control-plane}
      annotations: {wasmhooks.dev/image-id: "__CONTROL_PLANE_IMAGE_ID__"}
    spec:
      initContainers:
        - name: migrate
          image: &cpImage wasmhooks-m3/control-plane:local
          imagePullPolicy: Never
          command: [controlplane, migrate]
          env: &cpEnv
            - name: CP_DATABASE_URL
              valueFrom: {secretKeyRef: {name: m3-platform, key: CP_DATABASE_URL}}
            - name: CP_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: m3-platform, key: CP_INTERNAL_TOKEN}}
            - name: CP_TENANT_JWT_SECRET
              valueFrom: {secretKeyRef: {name: m3-platform, key: CP_TENANT_JWT_SECRET}}
            - name: CP_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: m3-platform, key: CP_S3_ACCESS_KEY}}
            - name: CP_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: m3-platform, key: CP_S3_SECRET_KEY}}
            - {name: CP_S3_ENDPOINT, value: "http://minio:9000"}
            - {name: CP_DATAPLANE_INTERNAL_URL, value: "http://executors:8081"}
        - name: init-bucket
          image: *cpImage
          imagePullPolicy: Never
          env: *cpEnv
          command: [python, -c]
          args:
            - |
              import os, boto3
              s3 = boto3.client("s3", endpoint_url=os.environ["CP_S3_ENDPOINT"], region_name="us-east-1",
                                aws_access_key_id=os.environ["CP_S3_ACCESS_KEY"],
                                aws_secret_access_key=os.environ["CP_S3_SECRET_KEY"])
              if "modules" not in {b["Name"] for b in s3.list_buckets()["Buckets"]}:
                  s3.create_bucket(Bucket="modules")
      containers:
        - name: control-plane
          image: *cpImage
          imagePullPolicy: Never
          env: *cpEnv
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: executors}
spec:
  clusterIP: None
  selector: {app: executor}
  ports:
    - {name: grpc, port: 9090}
    - {name: validate, port: 8081}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: executor}
spec:
  replicas: 3
  selector: {matchLabels: {app: executor}}
  template:
    metadata:
      labels: {app: executor}
      annotations: {wasmhooks.dev/image-id: "__DATAPLANE_IMAGE_ID__"}
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: executor
          image: wasmhooks-m3/dataplane:local
          imagePullPolicy: Never
          args:
            - -role=executor
            - -executors=executors:9090
            - -executor-address=$(POD_IP):9090
            - -control-plane-url=http://control-plane:8000
            - -s3-endpoint=minio:9000
            - -s3-insecure
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: WASMHOOKS_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: m3-platform, key: WASMHOOKS_INTERNAL_TOKEN}}
            - name: WASMHOOKS_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: m3-platform, key: CP_S3_ACCESS_KEY}}
            - name: WASMHOOKS_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: m3-platform, key: WASMHOOKS_S3_SECRET_KEY}}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app: gateway}
  ports: [{name: invoke, port: 8080}, {name: diagnostics, port: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata:
      labels: {app: gateway}
      annotations: {wasmhooks.dev/image-id: "__DATAPLANE_IMAGE_ID__"}
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: gateway
          image: wasmhooks-m3/dataplane:local
          imagePullPolicy: Never
          args:
            - -role=gateway
            - -executors=executors:9090
            - -control-plane-url=http://control-plane:8000
          env:
            - name: WASMHOOKS_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: m3-platform, key: WASMHOOKS_INTERNAL_TOKEN}}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata: {name: demo-shop}
spec:
  selector: {app: demo-shop}
  ports: [{port: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: demo-shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: demo-shop}}
  template:
    metadata:
      labels: {app: demo-shop}
      annotations: {wasmhooks.dev/image-id: "__DEMO_SHOP_IMAGE_ID__"}
    spec:
      containers:
        - name: demo-shop
          image: wasmhooks-m3/demo-shop:local
          imagePullPolicy: Never
          env:
            - name: DS_API_KEY
              valueFrom: {secretKeyRef: {name: m3-installation, key: SHOP_API_KEY}}
            - {name: DS_DATAPLANE_URL, value: "http://gateway:8080"}
            - {name: DS_CONTROL_PLANE_URL, value: "http://control-plane:8000"}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 2
