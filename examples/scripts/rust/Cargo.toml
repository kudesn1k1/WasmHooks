[workspace]
resolver = "2"
members = ["discount", "infinite-loop", "memory-bomb", "counter", "guest-error", "echo-config", "bad-output", "http-call"]

[workspace.dependencies]
extism-pdk = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
