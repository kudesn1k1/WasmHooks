openapi: 3.1.0
info:
  title: WasmHooks Control Plane API
  description: 'API консолей оператора и тенанта. Владелец контракта: backend, Python
    (docs/TEAM.md); файл api/control-plane.openapi.yaml генерируется из кода командой
    `controlplane openapi`.'
  version: 0.1.0
paths:
  /api/v1/tenants/{external_id}/console-sessions:
    post:
      tags:
      - tenant console sessions
      summary: Выписать токен консоли тенанта
      description: Бэкенд оператора выписывает короткоживущий токен для своего тенанта
        и передаёт его в браузер тенанта; консоль тенанта ходит с ним как с Bearer-токеном
        (решение D18).
      operationId: create_console_session_api_v1_tenants__external_id__console_sessions_post
      security:
      - operatorKey: []
      parameters:
      - name: external_id
        in: path
        required: true
        schema:
          type: string
          title: External Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleSession'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/hooks:
    get:
      tags:
      - hooks
      summary: Список хуков
      operationId: list_hooks_api_v1_hooks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookList'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - operatorKey: []
    post:
      tags:
      - hooks
      summary: Создать хук
      operationId: create_hook_api_v1_hooks_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HookCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hook'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - operatorKey: []
  /api/v1/hooks/{name}:
    get:
      tags:
      - hooks
      summary: Определение хука
      operationId: get_hook_api_v1_hooks__name__get
      security:
      - operatorKey: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hook'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
      - hooks
      summary: Заменить определение хука
      description: Полная замена определения; имя неизменно. Без изменений — ответ
        без роста def_version. Списки разрешённых host-функций и эффектов могут только
        расти.
      operationId: replace_hook_api_v1_hooks__name__put
      security:
      - operatorKey: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HookSpec'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hook'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/tenants:
