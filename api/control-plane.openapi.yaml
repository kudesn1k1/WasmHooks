        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - operatorKey: []
  /api/v1/tenants/{external_id}:
    get:
      tags:
      - tenants
      summary: Получить тенанта
      description: Реализуется в T1, см. docs/handoff/backend.md.
      operationId: get_tenant_api_v1_tenants__external_id__get
      security:
      - operatorKey: []
      parameters:
      - name: external_id
        in: path
        required: true
        schema:
          type: string
          title: External Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
      - tenants
      summary: Изменить тенанта
      description: Реализуется в T1, см. docs/handoff/backend.md.
      operationId: patch_tenant_api_v1_tenants__external_id__patch
      security:
      - operatorKey: []
      parameters:
      - name: external_id
        in: path
        required: true
        schema:
          type: string
          title: External Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/api-keys:
    get:
      tags:
      - api-keys
      summary: Список ключей
      description: Реализуется в T2, см. docs/handoff/backend.md.
      operationId: list_api_keys_api_v1_api_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - operatorKey: []
    post:
      tags:
      - api-keys
      summary: Выпустить ключ
      description: Реализуется в T2, см. docs/handoff/backend.md. Токен показывается
        один раз.
      operationId: create_api_key_api_v1_api_keys_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - operatorKey: []
  /api/v1/api-keys/{key_id}:
    delete:
      tags:
      - api-keys
      summary: Отозвать ключ
      description: Реализуется в T2, см. docs/handoff/backend.md.
      operationId: revoke_api_key_api_v1_api_keys__key_id__delete
      security:
      - operatorKey: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          title: Key Id
      responses:
        '204':
          description: Successful Response
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/tenant/hooks:
    get:
      tags:
      - tenant
      summary: Хуки тенанта
      description: Реализуется в T6, см. docs/handoff/backend.md.
      operationId: list_hooks_api_v1_tenant_hooks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantHookList'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - tenantToken: []
  /api/v1/tenant/hooks/{hook}:
    get:
      tags:
      - tenant
      summary: Хук тенанта
      description: Реализуется в T6, см. docs/handoff/backend.md.
      operationId: get_hook_api_v1_tenant_hooks__hook__get
      security:
      - tenantToken: []
      parameters:
      - name: hook
        in: path
        required: true
        schema:
          type: string
          title: Hook
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantHook'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/tenant/hooks/{hook}/modules:
    get:
      tags:
      - tenant
      summary: Версии модуля хука
      description: Реализуется в T3, см. docs/handoff/backend.md.
      operationId: list_modules_api_v1_tenant_hooks__hook__modules_get
      security:
      - tenantToken: []
      parameters:
      - name: hook
        in: path
        required: true
        schema:
          type: string
          title: Hook
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleList'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - tenant
      summary: Загрузить версию модуля
      description: Тело multipart/form-data, поле file. Реализуется в T3, см. docs/handoff/backend.md.
      operationId: upload_module_api_v1_tenant_hooks__hook__modules_post
      security:
      - tenantToken: []
      parameters:
      - name: hook
        in: path
        required: true
        schema:
          type: string
          title: Hook
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_module_api_v1_tenant_hooks__hook__modules_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/tenant/hooks/{hook}/binding:
    put:
      tags:
      - tenant
      summary: Изменить привязку хука
      description: Активная версия и/или конфиг. Реализуется в T5, см. docs/handoff/backend.md.
      operationId: update_binding_api_v1_tenant_hooks__hook__binding_put
      security:
      - tenantToken: []
      parameters:
      - name: hook
        in: path
        required: true
        schema:
          type: string
          title: Hook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantBinding'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    ApiKey:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        created_at:
          type: string
          format: date-time
          title: Created At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
      type: object
      required:
      - id
      - name
      - created_at
      - revoked_at
      title: ApiKey
    ApiKeyCreate:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          title: Name
      type: object
      required:
      - name
      title: ApiKeyCreate
    ApiKeyCreated:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        created_at:
          type: string
          format: date-time
          title: Created At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        token:
          type: string
          title: Token
      type: object
      required:
      - id
      - name
      - created_at
      - revoked_at
      - token
      title: ApiKeyCreated
    ApiKeyList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ApiKey'
          type: array
          title: Items
      type: object
      required:
      - items
      title: ApiKeyList
    BindingUpdate:
      properties:
        active_module_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Module Id
        config:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Config
      additionalProperties: false
      type: object
      title: BindingUpdate
    Body_upload_module_api_v1_tenant_hooks__hook__modules_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_module_api_v1_tenant_hooks__hook__modules_post
    ConsoleSession:
      properties:
        token:
          type: string
          title: Token
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - token
      - expires_at
      title: ConsoleSession
    Hook:
      properties:
        input_schema:
          additionalProperties: true
          type: object
          title: Input Schema
          description: JSON Schema (draft 2020-12) of the payload operators send.
        output_schema:
          additionalProperties: true
          type: object
          title: Output Schema
          description: JSON Schema (draft 2020-12) of the result scripts return.
        timeout_ms:
          type: integer
          maximum: 30000.0
          minimum: 1.0
          title: Timeout Ms
          description: Time limit of one call.
        memory_max_pages:
          type: integer
          maximum: 16384.0
          minimum: 16.0
          title: Memory Max Pages
          description: Linear memory limit in 64 KiB pages.
        allowed_host_functions:
          items:
            type: string
          type: array
          title: Allowed Host Functions
          description: Host functions scripts may import. Only grows.
        allowed_effect_types:
          items:
            type: string
          type: array
          title: Allowed Effect Types
          description: Effect types scripts may return. Only grows.
        sample_input:
          additionalProperties: true
          type: object
          title: Sample Input
          description: A payload matching input_schema, used to validate uploaded
            scripts.
        name:
          type: string
          maxLength: 128
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
          title: Name
        def_version:
          type: integer
          title: Def Version
          description: Grows by one on every change of the definition.
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      additionalProperties: false
      type: object
      required:
      - input_schema
      - output_schema
      - timeout_ms
      - memory_max_pages
      - sample_input
      - name
      - def_version
      - created_at
      - updated_at
      title: Hook
    HookCreate:
      properties:
        input_schema:
          additionalProperties: true
          type: object
          title: Input Schema
          description: JSON Schema (draft 2020-12) of the payload operators send.
        output_schema:
          additionalProperties: true
          type: object
          title: Output Schema
          description: JSON Schema (draft 2020-12) of the result scripts return.
        timeout_ms:
          type: integer
          maximum: 30000.0
          minimum: 1.0
          title: Timeout Ms
          description: Time limit of one call.
        memory_max_pages:
          type: integer
          maximum: 16384.0
          minimum: 16.0
          title: Memory Max Pages
          description: Linear memory limit in 64 KiB pages.
        allowed_host_functions:
          items:
            type: string
          type: array
          title: Allowed Host Functions
          description: Host functions scripts may import. Only grows.
        allowed_effect_types:
          items:
            type: string
          type: array
          title: Allowed Effect Types
          description: Effect types scripts may return. Only grows.
        sample_input:
          additionalProperties: true
          type: object
          title: Sample Input
          description: A payload matching input_schema, used to validate uploaded
            scripts.
        name:
          type: string
          maxLength: 128
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$
          title: Name
      additionalProperties: false
      type: object
      required:
      - input_schema
