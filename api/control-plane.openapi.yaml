      summary: Создать тенанта
      description: Реализуется в T1, см. docs/handoff/backend.md.
      operationId: create_tenant_api_v1_tenants_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
        required: true
      responses:
        '201':
          description: Successful Response
