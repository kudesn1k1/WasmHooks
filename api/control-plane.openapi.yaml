                $ref: '#/components/schemas/TenantList'
        '400':
          description: Некорректные параметры запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Не авторизован
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Некорректное тело запроса
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - operatorKey: []
    post:
      tags:
