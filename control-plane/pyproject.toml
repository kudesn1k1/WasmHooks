[project]
name = "controlplane"
version = "0.1.0"
description = "WasmHooks control plane"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pyjwt>=2.10",
  "boto3>=1.35",
  "anyio>=4.6",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[project.scripts]
controlplane = "controlplane.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "asgi-lifespan>=2.1",
  "testcontainers[postgres,minio]>=4.8",
  "ruff>=0.8",
  "mypy>=1.13",
  "boto3-stubs[s3]>=1.35",
  "types-jsonschema",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
# RUF001: user-facing error titles are Russian on purpose (as in the console mocks).
ignore = ["S101", "RUF001"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
